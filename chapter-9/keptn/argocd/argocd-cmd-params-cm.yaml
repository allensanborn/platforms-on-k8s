# Send Argo CD's traces (controller, repo-server, API server) to Jaeger.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  otlp.address: jaeger.observability.svc.cluster.local:4317
  otlp.insecure: "true"
