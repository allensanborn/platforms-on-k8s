# Jaeger all-in-one (in-memory) instead of the jaeger-operator v1.45 Jaeger CR, which
# no longer reconciles on current Kubernetes (docs/findings/F040). Keeps the operator's
# service names: jaeger-collector (gRPC 14250, used by the OTel collector) and jaeger-query (16686).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: keptn-lifecycle-toolkit-system
spec:
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.74.0
        ports:
        - containerPort: 14250
        - containerPort: 16686
        readinessProbe:
          httpGet:
            path: /
            port: 14269
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: keptn-lifecycle-toolkit-system
spec:
  selector:
    app: jaeger
  ports:
  - name: grpc
    port: 14250
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: keptn-lifecycle-toolkit-system
spec:
  selector:
    app: jaeger
  ports:
  - name: http-query
    port: 16686
