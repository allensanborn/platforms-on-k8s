# Argo CD runs this Job after every successful sync of the `conference` Application,
# once all synced resources are Healthy (the replacement for Keptn's post-deployment task).
# It prints what was just deployed: each Deployment, its app.kubernetes.io/version and image.
apiVersion: batch/v1
kind: Job
metadata:
  # Argo CD names hook Jobs <generateName>-postsync-<timestamp>
  generateName: post-sync-notification
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: post-sync-notification
      restartPolicy: Never
      containers:
      - name: notify
        image: registry.k8s.io/kubectl:v1.35.0
        args:
        - get
        - deployments
        - -o
        - 'jsonpath={range .items[*]}{.metadata.name}{"\tversion="}{.spec.template.metadata.labels.app\.kubernetes\.io/version}{"\timage="}{.spec.template.spec.containers[0].image}{"\n"}{end}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: post-sync-notification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: post-sync-notification
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: post-sync-notification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: post-sync-notification
subjects:
- kind: ServiceAccount
  name: post-sync-notification
