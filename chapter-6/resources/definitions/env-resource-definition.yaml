apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: environments.salaboy.com
spec:
  scope: Namespaced
  group: salaboy.com
  names:
    kind: Environment
    plural: environments
    shortNames:
      - "env"
      - "envs"
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.name
      name: CONNECT-TO
      type: string
    - jsonPath: .spec.crossplane.compositionSelector.matchLabels.type
      name: TYPE
      type: string
    - jsonPath: .spec.parameters.installInfra
      name: INFRA
      type: boolean
    - jsonPath: .spec.parameters.frontend.debug
      name: DEBUG
      type: boolean
    name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  installInfra:
                    type: boolean
                    default: true
                  frontend:
                    type: object
                    properties:
                      debug:
                        type: boolean
                        default: false
            required:
            - parameters
