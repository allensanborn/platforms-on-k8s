# provider-helm v1.x: namespaced Releases (helm.m.crossplane.io) reference either a
# namespaced ProviderConfig or this cluster-wide one, which installs into the host cluster.
apiVersion: helm.m.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: InjectedIdentity
