# Kafka for the Knative examples (replaces the Bitnami kafka chart).
# Needs the Strimzi operator: see chapter-2/README.md. Bootstrap: kafka-kafka-bootstrap:9092
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-dual-role
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: 1Gi
      deleteClaim: true
      kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    version: 4.3.1
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: events-topic
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 1
  replicas: 1
