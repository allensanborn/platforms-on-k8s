# Crossplane v2 + provider-upjet-aws namespaced managed resources (*.aws.m.upbound.io).
# UNTESTED against AWS: converted syntactically and schema-checked with `crossplane beta validate`.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kafka.mb.aws.salaboy.com
  labels:
    type: dev
    provider: aws
    kind: kafka
spec:
  compositeTypeRef:
    apiVersion: salaboy.com/v1alpha1
    kind: MessageBroker
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: kafka
        base:
          apiVersion: kafka.aws.m.upbound.io/v1beta1
          kind: Cluster
          spec:
            forProvider:
              region: us-west-2
              kafkaVersion: 3.6.0
              numberOfBrokerNodes: 2
              brokerNodeGroupInfo:
                instanceType: kafka.t3.small
                # MSK needs one client subnet per broker AZ and a security group;
                # the book's version omitted them. Select them by label here.
                clientSubnetsSelector:
                  matchLabels:
                    platform.salaboy.com/msk: "true"
                securityGroupsSelector:
                  matchLabels:
                    platform.salaboy.com/msk: "true"
                storageInfo:
                  ebsStorageInfo:
                    volumeSize: 1
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
        patches:
        - fromFieldPath: metadata.name
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-kafka"
        - fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.clusterName
        - fromFieldPath: metadata.name
          toFieldPath: spec.writeConnectionSecretToRef.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-kafka-connection"
