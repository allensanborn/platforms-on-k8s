# Crossplane v2 + provider-upjet-aws namespaced managed resources (*.aws.m.upbound.io).
# UNTESTED against AWS: converted syntactically and schema-checked with `crossplane beta validate`.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: keyvalue.db.aws.salaboy.com
  labels:
    type: dev
    provider: aws
    kind: keyvalue
spec:
  compositeTypeRef:
    apiVersion: salaboy.com/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: redis
        base:
          apiVersion: elasticache.aws.m.upbound.io/v1beta1
          kind: Cluster
          spec:
            forProvider:
              region: us-west-2
              engine: redis
              nodeType: cache.t3.micro
              numCacheNodes: 1
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
        patches:
        - fromFieldPath: metadata.name
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-redis"
        - fromFieldPath: metadata.name
          toFieldPath: spec.writeConnectionSecretToRef.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-redis-connection"
