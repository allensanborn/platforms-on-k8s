# Crossplane v2 + provider-upjet-aws namespaced managed resources (*.aws.m.upbound.io).
# Run end to end against Floci 2.1.0 (see ../floci/); not run against a real AWS account.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: keyvalue.db.aws.salaboy.com
  labels:
    type: dev
    provider: aws
    kind: keyvalue
spec:
  compositeTypeRef:
    apiVersion: salaboy.com/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: redis
        base:
          # A ReplicationGroup, not a Cluster: the provider only publishes a Cluster's address
          # to the connection Secret for memcached, and Floci only runs memcached Clusters.
          # The Secret gets primary_endpoint_address and port.
          apiVersion: elasticache.aws.m.upbound.io/v1beta1
          kind: ReplicationGroup
          spec:
            forProvider:
              region: us-west-2
              description: Conference app key-value store
              engine: redis
              nodeType: cache.t3.micro
              numCacheClusters: 1
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
        patches:
        - fromFieldPath: metadata.name
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-redis"
        - fromFieldPath: metadata.name
          toFieldPath: spec.writeConnectionSecretToRef.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-redis-connection"
