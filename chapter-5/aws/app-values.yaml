# Fill the three placeholders from the managed resources' status, as shown in the README:
#   KAFKA_BOOTSTRAP  first broker of status.atProvider.bootstrapBrokers on the MSK Cluster
#   REDIS_HOST       primary (or configuration) endpoint address of the ElastiCache ReplicationGroup
#   POSTGRES_HOST    `address` key of the aws-db-sql-postgres-connection Secret
install:
  infrastructure: false
frontend:
  kafka:
    url: KAFKA_BOOTSTRAP
agenda:
  kafka:
    url: KAFKA_BOOTSTRAP
  redis:
    host: REDIS_HOST
    # The ReplicationGroup has no auth token: leave secretName unset
c4p:
  kafka:
    url: KAFKA_BOOTSTRAP
  postgresql:
    host: POSTGRES_HOST
    secretName: aws-db-sql-postgres-password
    secretKey: password
notifications:
  kafka:
    url: KAFKA_BOOTSTRAP
