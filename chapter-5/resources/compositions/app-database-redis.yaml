# Crossplane v2: compose a Valkey (Redis-compatible) Deployment + Service directly.
# No Helm provider needed. Dev-grade: one replica, no persistence, no auth.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: keyvalue.db.local.salaboy.com
  labels:
    type: dev
    provider: local
    kind: keyvalue
spec:
  compositeTypeRef:
    apiVersion: salaboy.com/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: redis-deployment
        base:
          apiVersion: apps/v1
          kind: Deployment
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: redis
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: redis
              spec:
                containers:
                - name: redis
                  image: docker.io/valkey/valkey:9.1.2
                  ports:
                  - containerPort: 6379
                  readinessProbe:
                    tcpSocket:
                      port: 6379
        patches:
        - fromFieldPath: metadata.name
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-redis"
        - fromFieldPath: metadata.name
          toFieldPath: spec.selector.matchLabels[app.kubernetes.io/instance]
        - fromFieldPath: metadata.name
          toFieldPath: spec.template.metadata.labels[app.kubernetes.io/instance]
        readinessChecks:
        - type: MatchCondition
          matchCondition:
            type: Available
            status: "True"
      - name: redis-service
        base:
          apiVersion: v1
          kind: Service
          spec:
            selector:
              app.kubernetes.io/name: redis
            ports:
            - port: 6379
              targetPort: 6379
        patches:
        - fromFieldPath: metadata.name
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-redis"
        - fromFieldPath: metadata.name
          toFieldPath: spec.selector[app.kubernetes.io/instance]
        readinessChecks:
        - type: None
