# Crossplane v2: compose a CloudNativePG Cluster directly (operator must be installed).
# Superuser access is enabled because c4p-service connects as `postgres` to the `postgres` DB.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: sql.db.local.salaboy.com
  labels:
    type: dev
    provider: local
    kind: sql
spec:
  compositeTypeRef:
    apiVersion: salaboy.com/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: postgres-cluster
        base:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          spec:
            instances: 1
            enableSuperuserAccess: true
            bootstrap:
              initdb:
                postInitSQLRefs:
                  configMapRefs:
                  - name: c4p-init-sql   # resources/config/c4p-sql-init.yaml, same namespace
                    key: init.sql
            storage:
              size: 1Gi
        patches:
        - fromFieldPath: metadata.name
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-postgresql"
        - fromFieldPath: spec.parameters.size
          toFieldPath: spec.storage.size
          transforms:
          - type: map
            map:
              small: 1Gi
              medium: 10Gi
              large: 50Gi
