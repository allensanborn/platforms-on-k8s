apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agenda-service-deployment
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: agenda-service
  template:
    metadata:
      labels:
        app: agenda-service
        app.kubernetes.io/name: agenda-service
        app.kubernetes.io/part-of: agenda-service
        app.kubernetes.io/version: {{ .Values.services.tag  }}
        keptn.sh/post-deployment-tasks: stdout-notification
    spec:
{{- if .Values.install.infrastructure }}
{{ include "conference-app.waitFor" (list (printf "%s-kafka-bootstrap.%s.svc.cluster.local:9092" $.Release.Name $.Release.Namespace) (printf "%s-redis.%s.svc.cluster.local:6379" $.Release.Name $.Release.Namespace)) | indent 6 }}
{{- else }}
{{ include "conference-app.waitFor" (list (ternary .Values.agenda.kafka.url (printf "%s:9092" .Values.agenda.kafka.url) (contains ":" (toString .Values.agenda.kafka.url))) (ternary .Values.agenda.redis.host (printf "%s:6379" .Values.agenda.redis.host) (contains ":" (toString .Values.agenda.redis.host)))) | indent 6 }}
{{- end }}
      containers:
      - name: agenda-service
        image: "{{ .Values.services.registry }}/{{ .Values.services.agenda.image }}:{{ .Values.services.tag  }}"
        imagePullPolicy: Always
        env:
 {{- if .Values.install.infrastructure }}       
        - name: KAFKA_URL
          value: {{ .Release.Name }}-kafka-bootstrap.{{ .Release.Namespace }}.svc.cluster.local
        - name: REDIS_HOST
          value: {{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: redis-password
{{- else }}
        - name: KAFKA_URL
          value: {{ .Values.agenda.kafka.url}}
        - name: REDIS_HOST
          value: {{ .Values.agenda.redis.host}}
{{- if .Values.agenda.redis.secretName }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.agenda.redis.secretName}}
              key: {{ .Values.agenda.redis.secretKey | default "redis-password" }}
{{- end }}
{{- end }}              
        - name: POD_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName      
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agenda-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: agenda-service
  ports:
  - port: 80
    targetPort: 8080
