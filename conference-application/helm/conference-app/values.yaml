services:
  registry: salaboy
  tag: v1.0.0
  frontend: 
    image: frontend-go-1739aa83b5e69d4ccb8a5615830ae66c
  agenda: 
    image: agenda-service-0967b907d9920c99918e2b91b91937b3 
  c4p: 
    image: c4p-service-a3dc0474cbfa348afcdf47a8eee70ba9
  notifications: 
    image: notifications-service-0e27884e01429ab7e350cb5dff61b525
install:
  infrastructure: true
  ingress: true
# Redis-compatible key-value store: official Valkey chart, aliased as `redis`.
# The Secret it reads is created by templates/infrastructure.yaml.
redis:
  auth:
    enabled: true
    usersExistingSecret: "{{ .Release.Name }}-redis"
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: redis-password
  dataStorage:
    enabled: true
    requestedSize: 1Gi
# PostgreSQL (CloudNativePG Cluster) and Kafka (Strimzi) are rendered by
# templates/infrastructure.yaml; their operators must be installed first.
postgresql:
  storage:
    size: 1Gi
kafka:
  version: 4.3.1
  storage:
    size: 1Gi
