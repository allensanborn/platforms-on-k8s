spec:
  selector:
    matchLabels:
      app: agenda-service
  template:
    metadata:
      labels:
        app: agenda-service
        app.kubernetes.io/name: agenda-service
        app.kubernetes.io/part-of: agenda-service
        app.kubernetes.io/version: v1.2.0
        keptn.sh/post-deployment-tasks: stdout-notification
    spec:
      initContainers:
      - name: wait-for-dependencies
        image: docker.io/library/busybox:1.37
        command:
        - sh
        - -c
        - |
          for target in conference-kafka-bootstrap.default.svc.cluster.local:9092 conference-redis.default.svc.cluster.local:6379; do
            host="${target%:*}"; port="${target##*:}"
            until nc -z -w 2 "$host" "$port"; do echo "waiting for $target"; sleep 2; done
            echo "$target is reachable"
          done
      containers:
      - name: agenda-service
        image: "ghcr.io/allensanborn/agenda-service-0967b907d9920c99918e2b91b91937b3:v1.2.0"
        imagePullPolicy: Always
        env:       
        - name: KAFKA_URL
